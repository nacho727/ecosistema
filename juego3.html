<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 - ¿Quién se alimenta?</title>
    <link rel="stylesheet" href="css/games.css">
</head>
<body>
    <main class="gameShell">
        <header class="topBar">
            <div class="studentMini">
                <img data-student-avatar src="img/avatar_anime1.png" alt="Avatar">
                <div><span>Perfil</span><strong data-student-name>Estudiante</strong></div>
            </div>
            <div class="scoreBox"><img src="img/estrella.png" alt="Estrella"><span>Puntaje: <strong data-score>0</strong></span></div>
        </header>

        <section class="gamePanel pokemonPanel">
            <div class="gameHeader">
                <div>
                    <span class="unitBadge">Aventura 3 de 5</span>
                    <h1 data-game-title>Juego 3</h1>
                    <p class="readBox" data-game-instruction></p>
                </div>
                <a class="secondaryBtn" href="index_2.html">Ver 3D</a>
            </div>
            <div class="gameBoard">
                <div class="dragTray" data-drag-tray></div>
                <div class="dropTray" data-drop-tray></div>
            </div>
            <div class="gameActions">
                <button class="checkBtn" data-check>Revisar respuestas</button>
                <button class="secondaryBtn" data-reset>Reiniciar</button>
                <a class="primaryBtn nextBtn" data-next href="juego4.html">Siguiente juego</a>
                <div class="feedback" data-feedback>Relaciona cada alimento con quien lo consume.</div>
            </div>
        </section>
    </main>

    <script>
        window.ECO_GAME_CONFIG = {
            id: 3,
            title: "Juego 3: ¿Quién come qué?",
            instruction: "Arrastra cada alimento hacia el organismo que lo consume.",
            points: 20,
            next: "juego4.html",
            items: [
                { id: "hojas", label: "Hojas de planta", image: "img/cn-planta.svg", say: "Hojas de planta." },
                { id: "grillo", label: "Grillo", image: "img/cn-grillo.svg", say: "Grillo." },
                { id: "raton", label: "Ratón", image: "img/cn-raton.svg", say: "Ratón." },
                { id: "serpiente", label: "Serpiente", image: "img/cn-serpiente.svg", say: "Serpiente." }
            ],
            zones: [
                { label: "El grillo come...", accept: ["hojas"] },
                { label: "El ratón come...", accept: ["grillo"] },
                { label: "La serpiente come...", accept: ["raton"] },
                { label: "El águila come...", accept: ["serpiente"] }
            ]
        };
    </script>
    <script type="module" src="js/learningGames.js"></script>
</body>
</html>
