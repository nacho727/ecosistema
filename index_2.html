<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFoodChain 3D</title>

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/ui.css">
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>
</head>

<body>
    <div id="gameTitle">CADENA ALIMENTICIA 3D</div>

    <div id="hud">
        <div id="studentProfile">
            <img id="studentAvatar" src="./img/avatar_anime1.png" alt="Avatar del estudiante">
            <div>
                <span>Perfil</span>
                <strong id="studentName">Estudiante</strong>
            </div>
        </div>
        <div id="xpContainer">
            <div id="xpBar"></div>
        </div>
        <div id="level">Nivel 1</div>
        <div id="achievementPanel"></div>
        <h1>EcoFoodChain 3D</h1>
        <div id="xp">XP: 0</div>
        <div id="mission">Descubre la planta y activa las funciones del ecosistema</div>
    </div>

    <div id="infoPanel">
        <h2>Cadena alimentaria</h2>
        <p>Haz clic sobre un organismo para escuchar su explicacion y activar su funcion.</p>
    </div>

    <a id="quizBtn" href="./juego1.html">Preguntas y juegos</a>

    <script type="module" src="./js/app.js?v=3"></script>
</body>

</html>
