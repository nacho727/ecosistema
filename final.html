<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felicitaciones</title>
    <link rel="stylesheet" href="css/games.css">
</head>
<body>
    <main class="finalShell" data-final-page>
        <header class="topBar">
            <div class="studentMini">
                <img data-student-avatar src="img/avatar_anime1.png" alt="Avatar">
                <div><span>Perfil</span><strong data-student-name>Estudiante</strong></div>
            </div>
            <div class="scoreBox"><span class="star-icon" aria-hidden="true"></span><span>Puntaje total: <strong data-score>0</strong></span></div>
        </header>

        <section class="finalPanel pokemonPanel">
            <div>
                <span class="unitBadge">Misión completa</span>
                <h1>¡Felicitaciones, completaste todos los juegos!</h1>
                <p>Terminaste la aventura de la cadena alimenticia y aplicaste lo aprendido en los 5 juegos.</p>
                <div class="stars" aria-label="Tres estrellas animadas">
                    <span class="css-star"></span>
                    <span class="css-star"></span>
                    <span class="css-star"></span>
                </div>
                <p>Tu puntaje total es <strong data-score>0</strong> puntos.</p>
                <a class="primaryBtn" href="todos.html">Volver al menú principal</a>
                <a class="secondaryBtn" href="basico4.html">Reiniciar aprendizaje</a>
            </div>
        </section>
    </main>

    <script type="module" src="js/learningGames.js"></script>
</body>
</html>
